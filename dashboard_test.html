<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laravel CRM Dashboard</title>
    <link rel="preload" as="style" href="http://127.0.0.1:8000/build/assets/app-C0Cshvaf.css" /><link rel="modulepreload" href="http://127.0.0.1:8000/build/assets/app-D4fLRW7u.js" /><link rel="stylesheet" href="http://127.0.0.1:8000/build/assets/app-C0Cshvaf.css" /><script type="module" src="http://127.0.0.1:8000/build/assets/app-D4fLRW7u.js"></script></head>
<body class="bg-gray-100 antialiased">
    <div class="min-h-screen" x-data="dashboard()">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-6">
                    <div class="flex items-center">
                        <svg class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        <h1 class="ml-3 text-2xl font-bold text-gray-900">Laravel CRM</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-500">Dashboard</span>
                        <div class="h-3 w-3 bg-green-400 rounded-full animate-pulse" title="API Status: Online"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <!-- Loading State -->
            <div x-show="loading" class="text-center py-12">
                <div class="animate-spin rounded-full h-32 w-32 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-gray-600">Loading dashboard data...</p>
            </div>

            <!-- Dashboard Content -->
            <div x-show="!loading" class="space-y-6">
                <!-- Statistics Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white overflow-hidden shadow rounded-lg">
                        <div class="p-5">
                            <div class="flex items-center">
                                <div class="flex-shrink-0">
                                    <svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                    </svg>
                                </div>
                                <div class="ml-5 w-0 flex-1">
                                    <dl>
                                        <dt class="text-sm font-medium text-gray-500 truncate">Total Contacts</dt>
                                        <dd class="text-lg font-medium text-gray-900" x-text="stats.contacts?.total || 0"></dd>
                                    </dl>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white overflow-hidden shadow rounded-lg">
                        <div class="p-5">
                            <div class="flex items-center">
                                <div class="flex-shrink-0">
                                    <svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                                    </svg>
                                </div>
                                <div class="ml-5 w-0 flex-1">
                                    <dl>
                                        <dt class="text-sm font-medium text-gray-500 truncate">Active Leads</dt>
                                        <dd class="text-lg font-medium text-gray-900" x-text="stats.leads?.active || 0"></dd>
                                    </dl>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white overflow-hidden shadow rounded-lg">
                        <div class="p-5">
                            <div class="flex items-center">
                                <div class="flex-shrink-0">
                                    <svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                    </svg>
                                </div>
                                <div class="ml-5 w-0 flex-1">
                                    <dl>
                                        <dt class="text-sm font-medium text-gray-500 truncate">Pending Activities</dt>
                                        <dd class="text-lg font-medium text-gray-900" x-text="stats.activities?.pending || 0"></dd>
                                    </dl>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white overflow-hidden shadow rounded-lg">
                        <div class="p-5">
                            <div class="flex items-center">
                                <div class="flex-shrink-0">
                                    <svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" />
                                    </svg>
                                </div>
                                <div class="ml-5 w-0 flex-1">
                                    <dl>
                                        <dt class="text-sm font-medium text-gray-500 truncate">Pipeline Value</dt>
                                        <dd class="text-lg font-medium text-gray-900" x-text="'$' + (stats.revenue?.pipeline || 0).toLocaleString()"></dd>
                                    </dl>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- API Status Section -->
                <div class="bg-white shadow rounded-lg">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900">API Endpoints Status</h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <template x-for="(status, endpoint) in apiStatus" :key="endpoint">
                                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                    <span class="text-sm font-medium text-gray-900 capitalize" x-text="endpoint"></span>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                          :class="status === 'operational' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                                          x-text="status">
                                    </span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="bg-white shadow rounded-lg">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900">Quick Actions</h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <button @click="testEndpoint('/api/contacts')" class="flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                Test Contacts API
                            </button>
                            <button @click="testEndpoint('/api/leads')" class="flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                                Test Leads API
                            </button>
                            <button @click="testEndpoint('/api/activities')" class="flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                                Test Activities API
                            </button>
                        </div>
                    </div>
                </div>

                <!-- System Information -->
                <div class="bg-white shadow rounded-lg">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900">System Information</h3>
                    </div>
                    <div class="p-6">
                        <dl class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-2">
                            <div>
                                <dt class="text-sm font-medium text-gray-500">Laravel Version</dt>
                                <dd class="mt-1 text-sm text-gray-900" x-text="systemInfo.laravel_version"></dd>
                            </div>
                            <div>
                                <dt class="text-sm font-medium text-gray-500">PHP Version</dt>
                                <dd class="mt-1 text-sm text-gray-900" x-text="systemInfo.php_version"></dd>
                            </div>
                            <div>
                                <dt class="text-sm font-medium text-gray-500">Environment</dt>
                                <dd class="mt-1 text-sm text-gray-900" x-text="systemInfo.environment"></dd>
                            </div>
                            <div>
                                <dt class="text-sm font-medium text-gray-500">Database</dt>
                                <dd class="mt-1 text-sm text-gray-900">SQLite</dd>
                            </div>
                        </dl>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function dashboard() {
            return {
                loading: true,
                stats: {},
                apiStatus: {},
                systemInfo: {},

                async init() {
                    await this.loadDashboard();
                },

                async loadDashboard() {
                    try {
                        const response = await fetch('/api/dashboard');
                        const data = await response.json();
                        
                        this.stats = data.statistics || {};
                        this.apiStatus = data.api_status || {};
                        this.systemInfo = data.system_info || {};
                        
                        this.loading = false;
                    } catch (error) {
                        console.error('Failed to load dashboard:', error);
                        this.loading = false;
                    }
                },

                async testEndpoint(endpoint) {
                    try {
                        const response = await fetch(endpoint);
                        const data = await response.json();
                        
                        alert(`✅ ${endpoint} is working!\n\nResponse: ${JSON.stringify(data, null, 2).substring(0, 200)}...`);
                    } catch (error) {
                        alert(`❌ ${endpoint} failed!\n\nError: ${error.message}`);
                    }
                }
            }
        }
    </script>
</body>
</html>
